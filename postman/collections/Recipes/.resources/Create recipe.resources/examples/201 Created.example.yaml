$kind: http-example
name: 201 Created
request:
  method: POST
  url: '{{baseUrl}}/recipes'
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "title": "Mashed potatoes",
        "description": "Boil the potatoes until soft, then mash with butter.",
        "ingredients": [
          { "productId": "22222222-2222-7222-8222-222222222222", "quantity": 1.5 }
        ]
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Content-Type
      value: application/json
    - key: Location
      value: /recipes/11111111-1111-7111-8111-111111111111
  body:
    type: json
    content: |-
      {
        "id": "11111111-1111-7111-8111-111111111111",
        "title": "Mashed potatoes",
        "description": "Boil the potatoes until soft, then mash with butter.",
        "ingredients": [
          { "productId": "22222222-2222-7222-8222-222222222222", "quantity": 1.5 }
        ]
      }
order: 1000
