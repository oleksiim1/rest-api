$kind: http-example
name: 404 Not Found
request:
  method: GET
  url: '{{baseUrl}}/recipes/33333333-3333-7333-8333-333333333333'
  headers:
    - key: Accept
      value: application/json
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      { "error": "Recipe \"33333333-3333-7333-8333-333333333333\" was not found." }
order: 2000
