$kind: http-request
id: d97ee2f88fd1bdbb86068f2f
name: Show product
method: GET
url: '{{baseUrl}}/products/{{productId}}'
headers:
  - key: Accept
    value: application/json
description: Returns one product. Run Create product first, or set the productId collection variable.
order: 3000
examples: './.resources/Show product.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("body is the requested product", function () {
          const body = pm.response.json();
          pm.expect(body.id).to.eql(pm.collectionVariables.get("productId"));
          pm.expect(body).to.include.keys("name", "price", "unit");
          pm.expect(body.price).to.include.keys("amount", "currency");
      });
