$kind: http-example
name: 200 OK
request:
  method: PUT
  url: '{{baseUrl}}/products/{{productId}}'
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Honey",
        "price": { "amount": 2500, "currency": "UAH" },
        "unit": "kg"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": "11111111-1111-4111-8111-111111111111",
        "name": "Honey",
        "price": { "amount": 2500, "currency": "UAH" },
        "unit": "kg"
      }
order: 1000
