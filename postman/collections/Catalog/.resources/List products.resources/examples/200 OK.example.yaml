$kind: http-example
name: 200 OK
request:
  method: GET
  url: '{{baseUrl}}/products'
  headers:
    - key: Accept
      value: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": "11111111-1111-4111-8111-111111111111",
          "name": "Potato",
          "price": { "amount": 2500, "currency": "UAH" },
          "unit": "kg"
        }
      ]
order: 1000
