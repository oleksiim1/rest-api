$kind: http-example
name: 409 Conflict
request:
  method: POST
  url: '{{baseUrl}}/products'
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Potato",
        "price": { "amount": 2500, "currency": "UAH" },
        "unit": "kg"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "A product named \"Potato\" already exists."
      }
order: 2000
