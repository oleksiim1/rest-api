$kind: http-example
name: 404 Not Found
request:
  method: GET
  url: '{{baseUrl}}/products/{{productId}}'
  headers:
    - key: Accept
      value: application/json
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "Product \"11111111-1111-4111-8111-111111111111\" was not found."
      }
order: 2000
