# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(ELASTICSEARCH_URL): 'http://localhost:9200'
    env(ELASTICSEARCH_RECIPES_INDEX): 'recipes'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Entities, value objects and domain exceptions are not services.
            - '../src/*/Domain/'
            - '../src/Kernel.php'
            # Dev/test-only commands (they need require-dev packages); registered under when@dev/when@test.
            - '../src/Catalog/Presentation/Cli/'
            - '../src/Recipes/Presentation/Cli/'

    App\Catalog\Domain\ProductRepository: '@App\Catalog\Infrastructure\Persistence\Doctrine\DoctrineProductRepository'
    App\Recipes\Domain\RecipeRepository: '@App\Recipes\Infrastructure\Persistence\Doctrine\DoctrineRecipeRepository'
    App\Recipes\Application\ProductExistence: '@App\Recipes\Infrastructure\Catalog\CatalogProductExistence'
    App\Recipes\Application\AvailableProducts: '@App\Recipes\Infrastructure\Catalog\CatalogAvailableProducts'
    App\Recipes\Application\RecipeSearchIndex: '@App\Recipes\Infrastructure\Search\Elasticsearch\ElasticsearchRecipeSearchIndex'

    Elastic\Elasticsearch\Client:
        factory: ['Elastic\Elasticsearch\ClientBuilder', 'fromConfig']
        arguments:
            - { hosts: ['%env(ELASTICSEARCH_URL)%'] }

    App\Recipes\Infrastructure\Search\Elasticsearch\ElasticsearchRecipeSearchIndex:
        arguments:
            $indexName: '%env(ELASTICSEARCH_RECIPES_INDEX)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev: &dev_only_services
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Catalog\Presentation\Cli\:
            resource: '../src/Catalog/Presentation/Cli/'

        App\Recipes\Presentation\Cli\:
            resource: '../src/Recipes/Presentation/Cli/'

when@test: *dev_only_services
