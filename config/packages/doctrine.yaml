doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            product_id: App\Catalog\Infrastructure\Persistence\Doctrine\Type\ProductIdType
            recipe_id: App\Recipes\Infrastructure\Persistence\Doctrine\Type\RecipeIdType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        # Domain classes stay free of ORM imports, so each bounded context maps
        # its entities with XML in its Infrastructure layer. Register a context here:
        #
        # mappings:
        #     Billing:
        #         type: xml
        #         is_bundle: false
        #         dir: '%kernel.project_dir%/src/Billing/Infrastructure/Persistence/Doctrine/Mapping'
        #         prefix: 'App\Billing\Domain'
        #         alias: Billing
        mappings:
            Catalog:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Catalog\Domain'
                alias: Catalog
            Recipes:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Recipes/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Recipes\Domain'
                alias: Recipes
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
