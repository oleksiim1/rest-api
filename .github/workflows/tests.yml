name: Tests

# Runs the PHPUnit suite against Postgres, then the Elasticsearch integration tests,
# on every pull request into master, drafts included, and again on each new push to it.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Same major as compose.yaml, pinned to an exact tag.
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      elasticsearch:
        # Same exact version as compose.yaml.
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      # .env is not committed, so the kernel's required variables come from here.
      # APP_SECRET comes from the committed .env.test.
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8
      DEFAULT_URI: http://localhost
      ELASTICSEARCH_URL: http://127.0.0.1:9200

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          # Matches docker/php/Dockerfile (8.3.x).
          php-version: '8.3'
          extensions: ctype, iconv, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # The kernel boots .env through Dotenv::bootEnv(), which fails when the file is missing.
      # Composer's post-install cache:clear boots it too, so this runs before the install.
      - name: Create an empty .env
        run: touch .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      # The Elasticsearch adapter's tests, left out of the default run.
      - name: Run Elasticsearch integration tests
        run: vendor/bin/phpunit --group integration
