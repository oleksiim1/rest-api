name: PR review

# Runs only on demand, and only for the repository owner:
#   - comment "/review" on a pull request, or
#   - run the workflow manually from the Actions tab with a PR number.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-review-${{ inputs.pr_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Everyone except the repository owner is skipped before any step runs,
    # so the API is never called.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Delegate the review of this pull request to the pr-reviewer sub agent,
            passing it the repository and PR number above. Do not review the diff yourself.

            When the sub agent returns, write its review unchanged to a file, then post it
            as a single comment on the pull request with
            `gh pr comment ${{ env.PR_NUMBER }} --body-file <file>`,
            starting the comment with the heading "## Claude code review".
          claude_args: |
            --max-turns 15
            --allowedTools "Agent,Task,Read,Write,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
