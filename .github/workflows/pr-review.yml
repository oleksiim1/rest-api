name: PR review

# Runs only on demand, and only for the repository owner:
#   - comment "/review" on a pull request, or
#   - run the workflow manually from the Actions tab with a PR number.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-review-${{ inputs.pr_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Everyone except the repository owner is skipped before any step runs,
    # so the API is never called.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Runs the session as the pr-reviewer agent (.claude/agents/pr-reviewer.md), so its
      # instructions, tools and model apply directly. The review comes back as structured output.
      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: Review pull request ${{ env.PR_NUMBER }} in ${{ github.repository }}.
          claude_args: |
            --agent pr-reviewer
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"review":{"type":"string","description":"The full review in GitHub Markdown, ending with the verdict line."}},"required":["review"]}'

      # The review goes through an environment variable, never straight into the script,
      # so its contents cannot run as shell code.
      - name: Post the review on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: |
          {
            printf '## Claude code review\n\n'
            printf '%s\n' "$STRUCTURED_OUTPUT" | jq -r '.review'
          } > pr-review.md
          gh pr comment "$PR_NUMBER" --body-file pr-review.md

      # Fails the job unless the last non-empty line of the review is `VERDICT: PASS`.
      - name: Check the review verdict
        run: |
          verdict=$(grep -v '^[[:space:]]*$' pr-review.md | tail -n 1 | sed 's/[[:space:]]*$//')
          case "$verdict" in
            "VERDICT: PASS") echo "Verdict: PASS" ;;
            "VERDICT: BLOCK") echo "::error::Claude's review verdict is BLOCK."; exit 1 ;;
            *) echo "::error::The review does not end with a VERDICT line."; exit 1 ;;
          esac
