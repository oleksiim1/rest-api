name: PR review

# Runs only on demand, and only for the repository owner:
#   - comment "/review" on a pull request, or
#   - run the workflow manually from the Actions tab with a PR number.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-review-${{ inputs.pr_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Everyone except the repository owner is skipped before any step runs,
    # so the API is never called.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Runs the session as the pr-reviewer agent (.claude/agents/pr-reviewer.md), so its
      # instructions, tools and model apply directly. The review is the session's final answer,
      # read from the execution log in the next step.
      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: Review pull request ${{ env.PR_NUMBER }} in ${{ github.repository }}.
          claude_args: |
            --agent pr-reviewer
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Takes the review from the last `result` entry of the execution log. The review is read
      # from a file into a variable, never written into the script, so it cannot run as shell code.
      - name: Post the review on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ ! -s "$EXECUTION_FILE" ]; then
            echo "::error::The review step left no execution log."
            exit 1
          fi
          review=$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXECUTION_FILE")
          if [ -z "${review//[[:space:]]/}" ]; then
            echo "::error::Claude returned no review text."
            exit 1
          fi
          {
            printf '## Claude code review\n\n'
            printf '%s\n' "$review"
          } > pr-review.md
          gh pr comment "$PR_NUMBER" --body-file pr-review.md

      # Fails the job unless the last non-empty line of the review is `VERDICT: PASS`.
      - name: Check the review verdict
        run: |
          verdict=$(grep -v '^[[:space:]]*$' pr-review.md | tail -n 1 | sed 's/[[:space:]]*$//')
          case "$verdict" in
            "VERDICT: PASS") echo "Verdict: PASS" ;;
            "VERDICT: BLOCK") echo "::error::Claude's review verdict is BLOCK."; exit 1 ;;
            *) echo "::error::The review does not end with a VERDICT line."; exit 1 ;;
          esac
