name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only review non-draft PRs opened by the repository owner; everyone else is
    # skipped before any step runs, so the API is never called.
    if: >-
      github.event.pull_request.user.login == 'oleksiim1' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Delegate the review of this pull request to the pr-reviewer sub agent,
            passing it the repository and PR number above. Do not review the diff yourself.

            When the sub agent returns, write its review unchanged to a file, then post it
            as a single comment on the pull request with
            `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`,
            starting the comment with the heading "## Claude code review".
          claude_args: |
            --max-turns 15
            --allowedTools "Agent,Task,Read,Write,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"