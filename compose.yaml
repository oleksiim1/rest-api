services:
  php:
    build: ./docker/php
    # Installs dependencies on a fresh checkout, then runs PHP-FPM in the foreground.
    command: sh -c "[ -f vendor/autoload_runtime.php ] || composer install --no-interaction; exec php-fpm"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?serverVersion=17&charset=utf8
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - .:/var/www/html
      - ./var:/var/www/html/var
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      # 5433 on the host, because 5432 is commonly taken by a local Postgres.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Host directory, so this cluster is not the stuck named volume.
      - ./docker/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      # Local development only: plain HTTP, no authentication.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      # Named volume, because a bind mount hits host permissions for the ES user.
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  esdata:
